<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnavalsjury</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; color: #e5e7eb; }
    .container { max-width: 480px; margin: 1.5rem auto; padding: 1rem; background: #020617; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; font-size: 1.4rem; text-align: center; }
    #login-section { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.75rem; font-size: 0.9rem; }
    select, input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      display: block;
    }
    .contestant { display: flex; align-items: center; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px solid #111827; font-size: 0.9rem; }
    .scores { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
    .score-btn { border-radius: 999px; padding: 0.2rem 0.5rem; border: 1px solid #4b5563; background: #020617; color: #e5e7eb; font-size: 0.75rem; }
    .score-btn.used { background: #374151; color: #9ca3af; border-color: #374151; }
    .score-btn.selected { background: #4f46e5; border-color: #4f46e5; }
    .status { margin-top: 0.75rem; font-size: 0.85rem; color: #9ca3af; min-height: 1.2rem; }
    .status.error { color: #f97373; }
    .done-indicator { margin-top: 0.25rem; font-size: 0.8rem; color: #9ca3af; }
    .small-link { font-size: 0.8rem; color:#93c5fd; text-decoration:underline; cursor:pointer; margin-top:0.5rem; display:inline-block; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Carnavalsjury</h1>
    <p style="font-size:0.85rem;color:#9ca3af;">Log eerst in als jurylid. Elke score mag maar één keer per categorie gebruikt worden. Vergrendel per categorie als je klaar bent en markeer daarna de hele beoordeling als afgewerkt.</p>

    <section id="login-section">
      <label>
        Jurylid
        <select id="judge-select"></select>
      </label>
      <label>
        Wachtwoord
        <input type="password" id="judge-password" placeholder="Wachtwoord" />
      </label>
      <button type="button" id="judge-login-btn" style="width:100%;padding:0.4rem 0.6rem;border-radius:0.5rem;border:none;background:#4f46e5;color:#e5e7eb;font-size:0.85rem;">Inloggen</button>
      <div id="login-status" class="status"></div>
    </section>

    <section id="judge-content" style="display:none;">
      <p id="judge-info" style="font-size:0.85rem;color:#9ca3af;"></p>

      <label>
        Beoordeling
        <select id="scoring-select"></select>
      </label>

      <label>
        Categorie
        <select id="category-select"></select>
      </label>

      <button type="button" id="lock-toggle" style="margin-bottom:0.5rem;width:100%;padding:0.4rem 0.6rem;border-radius:0.5rem;border:none;background:#4b5563;color:#e5e7eb;font-size:0.85rem;">Vergrendel scores voor deze categorie</button>

      <button type="button" id="done-toggle" style="margin-bottom:0.75rem;width:100%;padding:0.35rem 0.6rem;border-radius:0.5rem;border:none;background:#6b7280;color:#e5e7eb;font-size:0.85rem;">Markeer beoordeling als afgewerkt</button>
      <div id="done-indicator" class="done-indicator"></div>

      <div id="contestants"></div>

      <div id="status" class="status"></div>

      <a href="/judge-password.html" class="small-link">Wachtwoord wijzigen</a>
    </section>
  </main>

  <script src="/main.js"></script>
</body>
</html>
