<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnavalsjury – Wachtwoord jurylid wijzigen</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; color: #e5e7eb; margin: 0; }
    .container { max-width: 480px; margin: 1.5rem auto; padding: 1rem; background: #020617; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin-bottom: 0.75rem; font-size: 0.9rem; }
    select, input[type="password"] { width: 100%; padding: 0.4rem 0.6rem; border-radius: 0.375rem; border: 1px solid #374151; background:#020617; color:#e5e7eb; }
    button { padding: 0.4rem 0.75rem; border-radius: 0.5rem; border:none; background:#4f46e5; color:#fff; font-size:0.85rem; width:100%; }
    .status { margin-top: 0.75rem; font-size: 0.85rem; color: #9ca3af; min-height: 1.2rem; }
    .status.error { color: #f97373; }
    a { color:#93c5fd; font-size:0.85rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Carnavalsjury – Wachtwoord wijzigen</h1>
    <p style="font-size:0.85rem;color:#9ca3af;">Kies je jurylid en vul je huidige en nieuwe wachtwoord in.</p>

    <label>
      Jurylid
      <select id="judge-select"></select>
    </label>

    <label>
      Huidig wachtwoord
      <input type="password" id="old-password" placeholder="Huidig wachtwoord" />
    </label>

    <label>
      Nieuw wachtwoord
      <input type="password" id="new-password" placeholder="Nieuw wachtwoord" />
    </label>

    <label>
      Bevestig nieuw wachtwoord
      <input type="password" id="confirm-password" placeholder="Bevestig nieuw wachtwoord" />
    </label>

    <button id="change-btn">Wachtwoord wijzigen</button>
    <div id="status" class="status"></div>

    <p style="margin-top:1rem;font-size:0.85rem;"><a href="/">Terug naar jurypanel</a></p>
  </main>

  <script>
    const judgeSelect = document.getElementById('judge-select');
    const oldPwdInput = document.getElementById('old-password');
    const newPwdInput = document.getElementById('new-password');
    const confirmPwdInput = document.getElementById('confirm-password');
    const changeBtn = document.getElementById('change-btn');
    const statusEl = document.getElementById('status');

    function setStatus(msg, isError) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', !!isError);
    }

    async function loadJudges() {
      const res = await fetch('/api/config');
      if (!res.ok) {
        setStatus('Kon juryleden niet laden.', true);
        return;
      }
      const cfg = await res.json();
      const judges = cfg.JUDGES || [];
      judgeSelect.innerHTML = '';
      judges.forEach((j) => {
        const opt = document.createElement('option');
        opt.value = j.id;
        opt.textContent = j.name;
        judgeSelect.appendChild(opt);
      });
    }

    changeBtn.addEventListener('click', async () => {
      const judgeId = Number(judgeSelect.value);
      const oldPwd = oldPwdInput.value || '';
      const newPwd = newPwdInput.value || '';
      const confirmPwd = confirmPwdInput.value || '';

      if (!judgeId || !oldPwd || !newPwd || !confirmPwd) {
        setStatus('Vul jurylid, huidig en nieuw wachtwoord in.', true);
        return;
      }
      if (newPwd !== confirmPwd) {
        setStatus('Nieuw wachtwoord en bevestiging komen niet overeen.', true);
        return;
      }

      try {
        const res = await fetch('/api/judge-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ judgeId, oldPassword: oldPwd, newPassword: newPwd }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus(data.error || `Fout ${res.status}`, true);
          return;
        }
        oldPwdInput.value = '';
        newPwdInput.value = '';
        confirmPwdInput.value = '';
        setStatus('Wachtwoord succesvol gewijzigd.', false);
      } catch (err) {
        console.error(err);
        setStatus('Kon wachtwoord niet wijzigen.', true);
      }
    });

    loadJudges().catch((err) => {
      console.error(err);
      setStatus('Kon juryleden niet laden.', true);
    });
  </script>
</body>
</html>
