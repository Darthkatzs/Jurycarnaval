<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnaval Judge Config</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; color: #e5e7eb; margin: 0; }
    .container { max-width: 960px; margin: 1.5rem auto; padding: 1rem; background: #020617; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    textarea { width: 100%; min-height: 400px; border-radius: 0.5rem; border: 1px solid #374151; background: #020617; color: #e5e7eb; padding: 0.5rem; font-family: Menlo, Monaco, Consolas, "Courier New", monospace; font-size: 0.85rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; background: #4f46e5; color: #fff; }
    .status { margin-top: 0.5rem; font-size: 0.85rem; color: #9ca3af; }
    .status.error { color: #f97373; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Carnaval Judge &mdash; Config</h1>
    <p style="font-size:0.85rem;color:#9ca3af;">Edit judges, contestants, categories, and allowed scores as JSON. Be careful: invalid JSON will be rejected.</p>
    <textarea id="config-text"></textarea>
    <button id="save-btn">Save</button>
    <div id="status" class="status"></div>
  </main>

  <script>
    const textarea = document.getElementById('config-text');
    const statusEl = document.getElementById('status');
    const saveBtn = document.getElementById('save-btn');

    function setStatus(msg, isError) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', !!isError);
    }

    async function loadConfig() {
      try {
        const res = await fetch('/admin/config');
        if (!res.ok) {
          setStatus('Failed to load config', true);
          return;
        }
        const data = await res.json();
        textarea.value = JSON.stringify(data, null, 2);
      } catch (err) {
        console.error(err);
        setStatus('Failed to load config', true);
      }
    }

    saveBtn.addEventListener('click', async () => {
      setStatus('Saving...');
      try {
        const text = textarea.value;
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (err) {
          setStatus('Invalid JSON: ' + err.message, true);
          return;
        }
        const res = await fetch('/admin/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(parsed),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus(data.error || 'Failed to save config', true);
          return;
        }
        setStatus('Config saved. You may need to refresh judge/admin pages to see changes.');
      } catch (err) {
        console.error(err);
        setStatus('Failed to save config', true);
      }
    });

    loadConfig();
  </script>
</body>
</html>
